name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run offline corpus, API, coverage, generated, and tarball gates
        run: npm test
      - name: Fetch pinned Quint syntax fixtures
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/quint-co/quint \
            "$RUNNER_TEMP/quint-upstream"
          git -C "$RUNNER_TEMP/quint-upstream" checkout --detach \
            fd772606588b40def9978d8c82da69c2db7a0e3b
          test "$(git -C "$RUNNER_TEMP/quint-upstream" rev-parse HEAD)" = \
            fd772606588b40def9978d8c82da69c2db7a0e3b
          test "$(sha256sum "$RUNNER_TEMP/quint-upstream/quint/src/generated/Quint.g4" | cut -d ' ' -f 1)" = \
            4a7129cfd2e75f115a80cf4c1bb07273d7c3f2728b1f4421ec4112aace07bf36
      - name: Check upstream manifest integrity mutations
        env:
          QUINT_UPSTREAM_CHECKOUT: ${{ runner.temp }}/quint-upstream
        run: node --test test/scripts/check-upstream-sources.test.mjs
      - name: Check all officially valid Quint sources
        run: npm run test:upstream-sources -- "$RUNNER_TEMP/quint-upstream"
